name: Deploy Vezura10x to GitHub Pages

on:
  push:
    branches:
      - claude/vezura10x-marketing-site-JboSx
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vezura10x/package-lock.json

      - name: Install dependencies
        working-directory: ./vezura10x
        run: npm ci

      - name: Build
        working-directory: ./vezura10x
        run: npm run build
        env:
          VITE_BASE_URL: /day1/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./vezura10x/dist
          publish_branch: gh-pages
          force_orphan: true
